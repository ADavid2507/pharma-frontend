<nav aria-label="Paginación">
  <span data-testid="resumen-paginacion"
    >{{ desde() }}–{{ hasta() }} de {{ totalElementos() }}</span
  >
  <label
    >Filas
    <select
      [ngModel]="tamanio()"
      [disabled]="deshabilitado()"
      (ngModelChange)="cambioTamanio.emit($event)"
    >
      @for (t of tamanios(); track t) {
        <option [ngValue]="t">{{ t }}</option>
      }
    </select></label
  >
  <button
    type="button"
    class="btn"
    aria-label="Primera página"
    [disabled]="deshabilitado() || pagina() === 0"
    (click)="ir(0)"
  >
    «
  </button>
  <button
    type="button"
    class="btn"
    [disabled]="deshabilitado() || pagina() === 0"
    (click)="ir(pagina() - 1)"
  >
    Anterior
  </button>
  <span data-testid="pagina-actual">Página {{ pagina() + 1 }} de {{ totalPaginas() || 1 }}</span>
  <button
    type="button"
    class="btn"
    [disabled]="deshabilitado() || pagina() >= totalPaginas() - 1"
    (click)="ir(pagina() + 1)"
  >
    Siguiente
  </button>
  <button
    type="button"
    class="btn"
    aria-label="Última página"
    [disabled]="deshabilitado() || pagina() >= totalPaginas() - 1"
    (click)="ir(totalPaginas() - 1)"
  >
    »
  </button>
</nav>
